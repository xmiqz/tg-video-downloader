<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任务编辑</title>
  <link rel="stylesheet" href="style.css">
  <script>
  /* 跟随主界面已保存外观：独立窗口无实时采样，液态玻璃按静态暗处理 */
  (function () {
    try {
      if (localStorage.getItem("appearance") === "light")
        document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
  </script>
</head>
<body>

  <div class="ambient">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
  </div>

  <div class="editor-app">
    <!-- 任务设置 -->
    <header class="glass editor-head">
      <div class="ed-task-info">
        <input id="ed2-title" class="ed-title-input" spellcheck="false">
        <div class="ed-meta">
          <span id="ed2-channel"></span>
          <span id="ed2-created"></span>
        </div>
      </div>
      <div class="ed-settings">
        <div class="ed-field">
          <label>保存目录</label>
          <div class="path-row">
            <input id="ed2-folder" type="text" readonly>
            <button class="btn glass-btn sm" onclick="edChooseFolder()">浏览</button>
          </div>
        </div>
        <div class="ed-field narrow">
          <label>并发 (1-8)</label>
          <input id="ed2-parallel" type="number" min="1" max="8">
        </div>
        <label class="check-line"><input id="ed2-move" type="checkbox">
          同时移动已下载文件</label>
        <button class="btn primary" onclick="edSave()">保存设置</button>
      </div>
    </header>

    <!-- 工具栏 -->
    <div class="glass editor-toolbar">
      <div class="search-box grow">
        <span class="search-ico">⌕</span>
        <input id="ed2-q" type="text" placeholder="筛选文件名 / TG 消息原文…"
               oninput="edRender()">
      </div>
      <div class="segmented" id="ed2-filter">
        <button class="seg active" data-f="all" onclick="edSetFilter('all')">全部</button>
        <button class="seg" data-f="done" onclick="edSetFilter('done')">已完成</button>
        <button class="seg" data-f="pending" onclick="edSetFilter('pending')">未下载</button>
        <button class="seg" data-f="failed" onclick="edSetFilter('failed')">失败</button>
        <button class="seg" data-f="skipped" onclick="edSetFilter('skipped')">跳过</button>
      </div>
      <button class="btn glass-btn sm" onclick="edSelectAll(true)">全选</button>
      <button class="btn glass-btn sm" onclick="edSelectAll(false)">清空</button>
      <span id="ed2-counts" class="ed-counts"></span>
    </div>

    <!-- 条目表格 -->
    <div class="glass editor-main">
      <table class="ed-table">
        <thead>
          <tr>
            <th class="c-check"></th>
            <th class="c-name">文件名</th>
            <th class="c-msg">TG 消息原文</th>
            <th class="c-dur">时长</th>
            <th class="c-date">日期</th>
            <th class="c-size">大小</th>
            <th class="c-st">状态</th>
            <th class="c-act">操作</th>
          </tr>
        </thead>
        <tbody id="ed2-rows"></tbody>
      </table>
    </div>

    <!-- 批量操作（选中时常驻底部） -->
    <div id="ed2-bulk" class="bulk-bar hidden">
      <span id="ed2-bulk-count" class="bulk-count">已选 0</span>
      <button class="btn glass-btn sm" onclick="edBulkStatus('pending')">标记重新下载</button>
      <button class="btn glass-btn sm" onclick="edBulkStatus('skipped')">标记跳过</button>
      <button class="btn danger sm" onclick="edBulkRemove()">移除条目</button>
    </div>
  </div>

  <script type="module" src="js/bridge.js"></script>
  <script src="editor.js"></script>
</body>
</html>
