<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TG 视频下载器</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<script>
/* 页面绘制前应用已保存的外观，避免主题闪烁（后端配置为准，这里仅镜像；
   外壳 tokens 层消费 <html data-theme>，router 启动时同源复核） */
(function () {
  try {
    var m = localStorage.getItem("appearance") || "dark";
    if (m === "light")
      document.documentElement.setAttribute("data-theme", "light");
  } catch (e) {}
})();
</script>
</head>
<body>
<script type="module" src="js/bridge.js"></script>
<script type="module">
import("./js/router.js").then(function (m) { m.boot(); })
  .catch(function (e) { console.error("外壳启动失败：", e); });
</script>
</body>
</html>
