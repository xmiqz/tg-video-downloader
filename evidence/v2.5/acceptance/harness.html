<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v2.5 动效验收夹具</title>
<link rel="stylesheet" href="../../../web/css/tokens.css">
<link rel="stylesheet" href="../../../web/css/ui.css">
<link rel="stylesheet" href="../../../web/css/views/xian.css">
<link rel="stylesheet" href="../../../web/css/views/active.css">
<link rel="stylesheet" href="../../../web/css/views/stage.css">
<style>
  /* 夹具只提供页面外框；弦/舞台/状态带全部消费生产组件与生产样式 */
  body { margin: 0; background: var(--color-surface); color: var(--color-text);
    font-family: var(--font-sans, system-ui, sans-serif); }
  .acc { max-width: 1120px; margin: 0 auto; padding: 16px 20px 28px; }
  @media (max-width: 767.98px) { .acc { padding: 16px 12px 28px; } }
  .acc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .acc-head h2 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  .acc-brand { width: 30px; height: 30px; flex: none; }
  .acc-sub { margin: 0; color: var(--color-text-muted); font-size: 13px; }
  .acc-card { display: flex; flex-direction: column; gap: 12px; padding: 16px;
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    background: var(--color-surface-raise); margin-bottom: 16px; }
  .acc-atoms { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .acc-hero { width: 96px; height: 96px; flex: none; }
  .acc-readout { font-size: 28px; font-weight: 700; letter-spacing: .3px;
    font-variant-numeric: tabular-nums; min-width: 96px; }
</style>
</head>
<body>
<div id="sh-root">
<main class="acc" id="acc-root">
  <div class="acc-head">
    <div class="acc-brand" id="brand" aria-hidden="true"></div>
    <div>
      <h2>动效验收夹具</h2>
      <p class="acc-sub">弦 · 数字滚动 · 下载链路舞台（生产组件）</p>
    </div>
  </div>

  <section class="acc-card">
    <div class="acc-atoms">
      <div class="acc-hero" id="hero" aria-hidden="true"></div>
      <span class="acc-readout" id="roll">0%</span>
    </div>

    <div class="ac-overview" id="overview">
      <div class="ac-stage-panel">
        <div class="ac-stage-host" id="stage" aria-label="下载链路舞台"></div>
      </div>
      <div class="ac-stage-band" id="band">
        <span class="ac-stage-prog"><div class="u-progress" data-determinate="true">
          <div class="u-progress-track"><div class="u-progress-fill" id="fill2" style="width:0%"></div></div>
        </div></span>
        <span class="ac-stage-pct-wrap">
          <span class="ac-stage-pct-label">总体进度</span>
          <span class="ac-stage-pct" id="pct">0%</span>
        </span>
        <span class="ac-stage-phase" id="phase"></span>
        <span class="ac-stage-countdown" id="countdown" hidden></span>
        <span class="ac-stage-counts" id="counts"></span>
        <span class="ac-stage-speed" id="speed">—</span>
        <span class="ac-stage-eta" id="eta">--</span>
        <button class="ac-stage-fold" type="button" aria-expanded="true">收起舞台</button>
      </div>
    </div>
  </section>
</div>
</div>

<script type="module">
  import { mountXian } from "../../../web/js/motion/xian.js";
  import { createRoller } from "../../../web/js/motion/calm.js";
  import { createStage, stagePhaseCopy } from "../../../web/js/motion/stage.js";

  const qs = new URLSearchParams(location.search);
  const theme = qs.get("theme") === "dark" ? "dark" : "light";
  const rm = qs.get("rm") === "1";
  // 静帧：截图取证只取编排结果（75% 下载中 / 100% 完成），动画行为由矩阵探针另行取证。
  // 截图为单次进程 --screenshot，避免 CDP surface 截图间歇混入浏览器浮层。
  const freeze = qs.get("freeze") === "done" ? "done"
    : (qs.get("freeze") === "mid" ? "mid" : null);
  if (freeze) {
    const still = document.createElement("style");
    still.textContent = "*, *::before, *::after { transition: none !important;" +
      " animation: none !important; }";
    document.head.appendChild(still);
  }
  document.documentElement.setAttribute("data-theme", theme);
  const root = document.getElementById("sh-root");
  if (rm) {
    root.classList.add("still");
    root.setAttribute("data-v22-rm", "on");
  }

  // 分档与生产一致：<640 mobile / 640–1023 tablet / 其余 desktop。
  function layoutFor() {
    const w = window.innerWidth;
    if (w < 640) return { mobile: true, concurrency: 4 };
    if (w < 1024) return { tablet: true, concurrency: 4 };
    return { concurrency: 4 };
  }

  const brand = mountXian(document.getElementById("brand"), {
    size: 30, state: "idle", decorative: true, reduced: rm,
  });
  const hero = mountXian(document.getElementById("hero"), {
    size: 96, state: "downloading", reduced: rm,
  });

  const sceneFor = (phase) => ({
    phase, pct: phase === "done" ? 100 : 75, speed: phase === "done" ? 0 : 751 * 1024,
    taskTotal: 42, taskFinished: phase === "done" ? 40 : 30, parallel: 4,
    busy: phase !== "done",
    counts: { active: phase === "done" ? 0 : 2, done: phase === "done" ? 38 : 30,
      fail: phase === "done" ? 2 : 0, paused: 0, skip: 0 },
    tasks: [
      { task_id: "t1", title: "任务 · 4K 主线", phase,
        counts: { active: 2, done: 5 }, task_total: 12, task_finished: 5, parallel: 4 },
      { task_id: "t2", title: "任务 · 番剧合集", phase: "flood_wait",
        phase_detail: "FloodWait 30s", counts: { paused: 2 },
        task_total: 10, task_finished: 3, parallel: 2 },
      { task_id: "t3", title: "任务 · 电影重试", phase: "fetching",
        counts: { active: 1, retrying: 2 }, task_total: 8, task_finished: 4, parallel: 2 },
      { task_id: "t4", title: "任务 · 短片并行", phase,
        counts: { active: 2 }, task_total: 20, task_finished: 11, parallel: 4 },
      { task_id: "t5", title: "任务 · 旧片", phase,
        counts: { active: 1 }, task_total: 6, task_finished: 2, parallel: 2 },
    ],
    focusId: "t1", operation: "download",
    items: [
      { name: "视频 1.mp4", status: "下载中", pct: 62, speed: 380 * 1024 },
      { name: "视频 2.mp4", status: "下载中", pct: 38, speed: 300 * 1024 },
      { name: "视频 3.mp4", status: "等待中", pct: 0 },
      { name: "视频 4.mp4", status: "等待中", pct: 0 },
      { name: "视频 5.mp4", status: "完成", pct: 100 },
      { name: "视频 6.mp4", status: "完成", pct: 100 },
      { name: "视频 7.mp4", status: "失败", pct: 44, error: "连接中断" },
      { name: "视频 8.mp4", status: "重试中", pct: 66 },
    ],
  });

  let scene = sceneFor("downloading");
  const stage = createStage(document.getElementById("stage"), Object.assign(layoutFor(), {
    doc: document, win: window, reduced: rm,
    onTaskSelect: (id) => { scene.focusId = id; stage.update(scene); paintBand(scene); },
  }));
  if (freeze) {
    // 静帧：一次性落到目标场景，首屏即终态
    scene = sceneFor(freeze === "done" ? "done" : "downloading");
    stage.update(scene);
    paintBand(scene);
  } else {
    // 首帧后再落数据：生产里舞台总在 active_states 事件帧之后填数，不在首帧前改写样式；
    // 夹具同样延后一帧，避免 Chromium 为「首帧前被改写的 width/opacity」留下 ct=0 挂起过渡。
    requestAnimationFrame(() => {
      stage.update(scene);
      paintBand(scene);
      roller.set(75);
    });
  }

  function paintBand(s) {
    const c = s.counts || {};
    document.getElementById("pct").textContent = Math.round(s.pct) + "%";
    document.getElementById("fill2").style.width = Math.max(0, Math.min(100, s.pct)) + "%";
    document.getElementById("counts").textContent = "完成 " + c.done + " · 跳过 " +
      c.skip + " · 失败 " + c.fail + " · 进行 " + c.active + " · 暂停 " + c.paused;
    document.getElementById("speed").textContent = s.speed > 0
      ? (s.speed < 1048576 ? (s.speed / 1024).toFixed(1) + " KB/s"
        : (s.speed / 1048576).toFixed(1) + " MB/s") : "—";
    document.getElementById("eta").textContent = s.phase === "done" ? "--" : "4:21";
    const copy = stagePhaseCopy(s.phase, s);
    document.getElementById("phase").textContent = s.tasks.length
      ? copy.label + " · " + copy.status : "暂无进行中任务";
    const n = Math.max(0, Number(s.countdown) || 0);
    const cd = document.getElementById("countdown");
    cd.textContent = n > 0 ? "限流 " + n + "s" : "";
    cd.hidden = n <= 0;
  }

  // 数字滚动：0 → 75（620ms 四段缓出；rm 下直跳）
  const rollEl = document.getElementById("roll");
  const roller = createRoller({
    from: 0, media: (rm || freeze) ? { matches: true } : null,
    update: (v) => { rollEl.textContent = Math.round(v) + "%"; },
  });
  if (freeze) {
    roller.set(freeze === "done" ? 100 : 75);
    if (hero) hero.setState(freeze === "done" ? "idle" : "downloading");
  }

  // 时间线：下载 → 主任务切换 → 完成 → 弦回待机（供残留探针）
  if (!freeze) {
    setTimeout(() => {
      const item = document.querySelector(".xian-stage-task-item");
      if (item) item.click();
    }, 1600);
    setTimeout(() => {
      scene = sceneFor("done");
      stage.update(scene);
      paintBand(scene);
      roller.set(100);
      if (hero) hero.setState("done");
    }, 3000);
    setTimeout(() => {
      if (hero) hero.setState("idle");
    }, 4200);
  }

  window.addEventListener("resize", () => stage.setLayout(layoutFor()));
  // headless 只在需要时出帧，CSS 过渡可能停在「未启动」状态（ct=0）；
  // 真实浏览器 / WebView2 恒有 vsync 帧，夹具用空 rAF 链复现同样的出帧节奏。
  (function vsync() { requestAnimationFrame(vsync); })();
  window.__acc = { stage, hero, brand, roller };
</script>
</body>
</html>
