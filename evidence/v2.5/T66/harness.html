<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T66 下载链路舞台夹具</title>
<link rel="stylesheet" href="../../../web/css/tokens.css">
<link rel="stylesheet" href="../../../web/css/ui.css">
<link rel="stylesheet" href="../../../web/css/views/active.css">
<link rel="stylesheet" href="../../../web/css/views/stage.css">
<style>
  /* 夹具只负责页面外框；舞台/状态带全部消费生产样式 */
  body { margin: 0; background: var(--color-surface); color: var(--color-text);
    font-family: var(--font-sans, system-ui, sans-serif); }
  .vw-active { max-width: 1120px; margin: 0 auto; padding: 14px 20px; }
  @media (max-width: 767.98px) { .vw-active { padding: 14px 12px; } }
</style>
</head>
<body>
<div id="sh-root">
<main class="vw-active" id="view">
  <div class="ac-head">
    <div class="ac-head-main">
      <h2>下载中</h2>
      <p class="ac-sub" id="sub">3 个任务下载中，按任务分组显示</p>
    </div>
  </div>

  <div class="ac-overview" id="overview">
    <div class="ac-stage-panel">
      <div class="ac-stage-host" id="stage" aria-label="下载链路舞台"></div>
    </div>
    <div class="ac-stage-band" id="band">
      <span class="ac-stage-prog"><div class="u-progress" data-determinate="true">
        <div class="u-progress-track"><div class="u-progress-fill" id="fill" style="width:75%"></div></div>
      </div></span>
      <span class="ac-stage-pct-wrap">
        <span class="ac-stage-pct-label">总体进度</span>
        <span class="ac-stage-pct" id="pct">75%</span>
      </span>
      <span class="ac-stage-phase" id="phase">下载中</span>
      <span class="ac-stage-countdown" id="countdown" hidden></span>
      <span class="ac-stage-counts" id="counts">完成 5 · 跳过 0 · 失败 0 · 进行 2 · 暂停 0</span>
      <span class="ac-stage-speed" id="speed">751.0 KB/s</span>
      <span class="ac-stage-eta" id="eta">4:21</span>
      <button class="ac-stage-fold" type="button" aria-expanded="true">收起舞台</button>
    </div>
  </div>
</main>
</div>

<script type="module">
  import { createStage, stagePhaseCopy } from "../../../web/js/motion/stage.js";

  const qs = new URLSearchParams(location.search);
  const theme = qs.get("theme") === "dark" ? "dark" : "light";
  const rm = qs.get("rm") === "1";
  const sceneKey = qs.get("scene") || "multi";
  const expand = qs.get("expand") === "1";
  const folded = qs.get("folded") === "1";
  document.documentElement.setAttribute("data-theme", theme);
  const root = document.getElementById("sh-root");
  if (rm) root.classList.add("still");
  if (folded) document.getElementById("overview").setAttribute("data-folded", "on");

  function layoutFor() {
    const w = window.innerWidth;
    if (w < 640) return { mobile: true, concurrency: 4 };
    if (w < 1024) return { tablet: true, concurrency: 4 };
    return { concurrency: 4 };
  }

  function makeTasks(n, opts) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(opts(i));
    return out;
  }

  function sceneFor(key) {
    if (key === "single") {
      return {
        phase: "downloading", pct: 42, speed: 1.2 * 1048576,
        taskTotal: 12, taskFinished: 5, parallel: 1, busy: false,
        counts: { active: 1, done: 5, fail: 0, paused: 0, skip: 0 },
        tasks: [{ task_id: "t1", title: "单任务 · 4K 合集", phase: "downloading",
          counts: { active: 1, done: 5 }, task_total: 12, task_finished: 5, parallel: 1 }],
        focusId: "t1", operation: "download",
        items: [
          { name: "片段 01.mp4", status: "下载中", pct: 62, speed: 1.2 * 1048576 },
          { name: "片段 02.mp4", status: "等待中", pct: 0 },
        ],
      };
    }
    if (key === "flood") {
      return {
        phase: "flood_wait", pct: 68, speed: 0, countdown: 30,
        taskTotal: 40, taskFinished: 27, parallel: 4, busy: false,
        counts: { active: 0, done: 27, fail: 0, paused: 4, skip: 0 },
        tasks: [
          { task_id: "t1", title: "主线任务 · 4K", phase: "flood_wait",
            phase_detail: "FloodWait 30s", counts: { paused: 4 },
            task_total: 40, task_finished: 27, parallel: 4 },
          { task_id: "t2", title: "重试任务 · 合集", phase: "fetching",
            counts: { active: 1, retrying: 1 },
            task_total: 18, task_finished: 9, parallel: 2 },
          { task_id: "t3", title: "并行任务 · 番剧", phase: "downloading",
            counts: { active: 2 },
            task_total: 24, task_finished: 8, parallel: 4 },
        ],
        focusId: "t1", operation: "download",
        items: [
          { name: "A.mp4", status: "已暂停", pct: 40 },
          { name: "B.mp4", status: "重试中", pct: 55 },
          { name: "C.mp4", status: "下载中", pct: 30, speed: 480 * 1024 },
          { name: "D.mp4", status: "等待中", pct: 0 },
          { name: "E.mp4", status: "失败", pct: 12, error: "连接中断" },
        ],
      };
    }
    if (key === "done") {
      return {
        phase: "done", pct: 100, speed: 0,
        taskTotal: 40, taskFinished: 38, parallel: 4, busy: false,
        counts: { active: 0, done: 38, fail: 2, paused: 0, skip: 0 },
        tasks: [{ task_id: "t1", title: "已完成任务", phase: "done",
          counts: { done: 38, fail: 2 }, task_total: 40, task_finished: 38, parallel: 4 }],
        focusId: "t1", operation: "download",
        items: [
          { name: "F.mp4", status: "完成", pct: 100 },
          { name: "G.mp4", status: "失败", pct: 88, error: "目标分片超时" },
        ],
      };
    }
    // multi：3 并行 + 1 FloodWait + 1 重试
    return {
      phase: "downloading", pct: 75, speed: 751 * 1024,
      taskTotal: 42, taskFinished: 30, parallel: 4, busy: false,
      counts: { active: 2, done: 30, fail: 0, paused: 0, skip: 0 },
      tasks: [
        { task_id: "t1", title: "任务 · 4K 主线", phase: "downloading",
          counts: { active: 2, done: 5 }, task_total: 12, task_finished: 5, parallel: 4 },
        { task_id: "t2", title: "任务 · 番剧合集", phase: "flood_wait",
          phase_detail: "FloodWait 30s", counts: { paused: 2 },
          task_total: 10, task_finished: 3, parallel: 2 },
        { task_id: "t3", title: "任务 · 电影重试", phase: "fetching",
          counts: { active: 1, retrying: 2 },
          task_total: 8, task_finished: 4, parallel: 2 },
        { task_id: "t4", title: "任务 · 短片并行", phase: "downloading",
          counts: { active: 2 }, task_total: 20, task_finished: 11, parallel: 4 },
        { task_id: "t5", title: "任务 · 旧片", phase: "downloading",
          counts: { active: 1 }, task_total: 6, task_finished: 2, parallel: 2 },
      ],
      focusId: "t1", operation: "download",
      items: makeTasks(8, (i) => ({
        name: "视频 " + (i + 1) + ".mp4",
        status: ["下载中", "下载中", "等待中", "等待中", "完成", "完成", "失败", "重试中"][i],
        pct: [62, 38, 0, 0, 100, 100, 44, 71][i],
        speed: i < 2 ? 380 * 1024 : 0,
        error: i === 6 ? "连接中断" : "",
      })),
    };
  }

  const scene = sceneFor(sceneKey);
  const stage = createStage(document.getElementById("stage"), {
    doc: document, win: window, reduced: rm, layout: layoutFor(),
    onTaskSelect: function (id) { scene.focusId = id; stage.update(scene); },
  });
  stage.update(scene);

  if (expand) {
    const more = document.querySelector(".xian-stage-queue-more");
    if (more) more.click();
    stage.update(scene);
  }

  function paintBand(s) {
    document.getElementById("pct").textContent = Math.round(s.pct) + "%";
    document.getElementById("fill").style.width = s.pct + "%";
    const counts = s.counts || {};
    document.getElementById("counts").textContent =
      "完成 " + counts.done + " · 跳过 " + counts.skip + " · 失败 " + counts.fail +
      " · 进行 " + counts.active + " · 暂停 " + counts.paused;
    document.getElementById("speed").textContent = s.speed > 0
      ? (s.speed < 1048576 ? (s.speed / 1024).toFixed(1) + " KB/s"
        : (s.speed / 1048576).toFixed(1) + " MB/s") : "—";
    document.getElementById("eta").textContent = s.phase === "flood_wait" ? "等待 30s" : "4:21";
    // 与 active.js syncStageBand 同口径：阶段说明与倒计时只在收起态由 CSS 显示。
    const copy = stagePhaseCopy(s.phase, s);
    const phase = document.getElementById("phase");
    phase.textContent = s.tasks && s.tasks.length
      ? copy.label + " · " + copy.status
      : "暂无进行中任务";
    const cd = document.getElementById("countdown");
    const n = Math.max(0, Number(s.countdown) || 0);
    cd.textContent = n > 0 ? "限流 " + n + "s" : "";
    cd.hidden = n <= 0;
  }
  paintBand(scene);

  // 录屏脚本：4 并发下载 → FloodWait → 重试恢复 → 完成（全部为合法阶段边）。
  if (qs.get("script") === "1") {
    const apply = (s) => { stage.update(s); paintBand(s); };
    setTimeout(() => apply(sceneFor("flood")), 1500);
    setTimeout(() => {
      const s = sceneFor("multi");
      s.pct = 84;
      s.speed = 512 * 1024;
      s.counts = { active: 1, done: 34, fail: 0, paused: 0, skip: 0 };
      s.tasks = s.tasks.map((t) => (t.task_id === "t3"
        ? { ...t, phase: "downloading", counts: { active: 1, retrying: 1 } } : t));
      s.items = s.items.map((it) => (it.status === "失败"
        ? { ...it, status: "重试中", pct: 66, error: "" } : it));
      apply(s);
    }, 3000);
    setTimeout(() => {
      const s = sceneFor("done");
      s.counts = { active: 0, done: 38, fail: 1, paused: 0, skip: 0 };
      apply(s);
    }, 4500);
  }
  if (folded) {
    document.querySelector(".ac-stage-fold").textContent = "展开舞台";
    document.querySelector(".ac-stage-fold").setAttribute("aria-expanded", "false");
  }
  window.addEventListener("resize", function () { stage.setLayout(layoutFor()); });
  window.__stage = stage;
  window.__scene = scene;
</script>
</body>
</html>
