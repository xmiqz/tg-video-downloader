<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>T67 favicon 与母版图标</title>
<style>
  :root{
    --bg:#F5ECE9; --fg:#2E1A10; --mute:#7A6A62; --card:#FFFDFB;
    --line:rgba(46,26,16,.12); --tab:#EDE3DF; --tab-on:#FFFDFB;
  }
  body[data-theme="dark"]{
    --bg:#0F0807; --fg:#F5ECE9; --mute:#A99890; --card:#1A1210;
    --line:rgba(245,236,233,.14); --tab:#241A17; --tab-on:#1A1210;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:32px 28px 40px}
  h1{font-size:16px;font-weight:600;margin:0 0 6px}
  p.note{margin:0 0 22px;color:var(--mute);font-size:12px}
  .tabs{display:flex;gap:6px;padding:8px 8px 0;background:var(--tab);
        border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:0}
  .tab{display:flex;align-items:center;gap:8px;padding:8px 14px;
       background:var(--tab-on);border-radius:8px 8px 0 0;font-size:12px;
       color:var(--fg);border:1px solid var(--line);border-bottom:0}
  .tab img{width:16px;height:16px;display:block}
  .tab.idle{background:transparent;color:var(--mute);border-color:transparent}
  .view{height:64px;background:var(--card);border:1px solid var(--line);
        border-radius:0 0 10px 10px}
  .row{display:flex;align-items:flex-end;gap:26px;margin-top:34px;
       padding:18px 20px;background:var(--card);border:1px solid var(--line);
       border-radius:12px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .cell span{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
  .cell img{display:block;image-rendering:auto}
  .sizes{margin-top:10px;color:var(--mute);font-size:12px}
</style>
</head>
<body data-theme="light">
<div class="wrap">
  <h1>页面 favicon 与母版图标（同一几何派生）</h1>
  <p class="note">favicon：/web/favicon.svg（64 母版）；应用图标母版：/web/assets/xian-icon.svg（256）；exe 图标：build/tvg.ico（16/24/32/48/64/128/256）。</p>

  <div class="tabs">
    <div class="tab"><img src="/web/favicon.svg" alt=""><span>当前标签页 · 16px</span></div>
    <div class="tab idle"><span>后台标签页</span></div>
    <div class="tab idle"><span>另一个窗口</span></div>
  </div>
  <div class="view"></div>

  <div class="row">
    <div class="cell"><img src="/web/favicon.svg" width="16" height="16" alt=""><span>16</span></div>
    <div class="cell"><img src="/web/favicon.svg" width="24" height="24" alt=""><span>24</span></div>
    <div class="cell"><img src="/web/favicon.svg" width="32" height="32" alt=""><span>32</span></div>
    <div class="cell"><img src="/web/favicon.svg" width="48" height="48" alt=""><span>48</span></div>
    <div class="cell"><img src="/web/favicon.svg" width="64" height="64" alt=""><span>64 · favicon 原生</span></div>
    <div class="cell"><img src="/web/assets/xian-icon.svg" width="128" height="128" alt=""><span>128 · 母版缩放</span></div>
  </div>
  <p class="sizes">尺寸标签仅表示显示像素，不含任何内容或路径信息。</p>
</div>
<script>
  var theme = /theme=dark/.test(location.search) ? "dark" : "light";
  document.body.setAttribute("data-theme", theme);
</script>
</body>
</html>
