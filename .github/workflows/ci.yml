name: ci

on:
  push:
    branches:
      - v2.4-dev
  pull_request:
    branches:
      - "v2.*"

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m py_compile server_app.py server_auth.py server_config.py gui.py tg_video_dl.py

      - name: Test
        run: python -m pytest -q
