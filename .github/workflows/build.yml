name: build-release

# 推送 v 开头的标签即构建并发布 Release；也可在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: windows-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (Windows GUI)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade telethon pyinstaller pywebview pythonnet Pillow

      - name: Install deps (CLI)
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade telethon pyinstaller

      - name: Build
        shell: bash
        run: python build.py dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List assets
        run: find artifacts -type f -print

      - name: Create release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat <<'EOF'
          ## TG 视频下载器

          Telegram 频道视频批量下载工具（Telethon）。

          ### 下载文件（按系统选择）
          - Windows x64：`TG视频下载器.exe`（图形界面）；`TG视频下载器_TUI.exe`（控制台版）
          - Windows ARM64（WOA）：`TG视频下载器_ARM64.exe`（图形界面）；`TG视频下载器_TUI_ARM64.exe`（控制台版）
          - Linux x64：`TG视频下载器_linux_x64`（命令行）
          - Linux ARM64：`TG视频下载器_linux_arm64`（命令行）
          - macOS Intel：`TG视频下载器_mac_x64`（命令行，另附 `.command` 双击启动）
          - macOS Apple Silicon：`TG视频下载器_mac_arm64`（命令行，另附 `.command` 双击启动）

          Windows 图形界面支持三种外观：静态暗（默认）、静态亮、液态玻璃（实时采样窗口后方画面）。
          首次运行输入手机号与验证码即可，数据保存在程序平级目录「TG视频下载器数据」。
          EOF
          )
          mapfile -t FILES < <(find artifacts -type f)
          printf '%s\n' "$TAG"
          gh release create "$TAG" "${FILES[@]}" \
            --title "$TAG" \
            --notes "$NOTES" \
            --latest

      - name: Create pre-release (manual dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dev-${GITHUB_SHA::7}"
          mapfile -t FILES < <(find artifacts -type f)
          gh release create "$TAG" "${FILES[@]}" \
            --title "开发构建 $TAG" \
            --notes "手动触发的开发构建，包含全部 6 个平台产物。" \
            --prerelease
