name: build-release

# 推送 v 开头的标签即构建并发布 Release；也可在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild (e.g. v2.5.1)"
        required: false
        type: string
      source_ref:
        description: "Commit/tag used as source (defaults to the selected ref)"
        required: false
        type: string
      rebuild_existing:
        description: "Replace assets on the existing release_tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # 发布前置校验：决定这次运行是否允许写 Release，并锁定唯一的源码提交。
  # 规则在 tools/release_preflight.py 中实现并有单元测试，避免只靠 workflow
  # 里的 shell 判断（历史上 workflow_dispatch 会把分支名当成 Release tag）。
  preflight:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_REF: ${{ inputs.source_ref }}
          INPUT_REBUILD: ${{ inputs.rebuild_existing }}
        run: |
          set -euo pipefail
          python3 tools/release_preflight.py \
            --workflow build \
            --event "$EVENT" \
            --release-tag "$INPUT_TAG" \
            --source-ref "$INPUT_REF" \
            --rebuild-existing "$INPUT_REBUILD" \
            --ref-name "$GITHUB_REF_NAME" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: windows-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 用 preflight 解析出的提交，而不是可能移动的分支名。
          ref: ${{ needs.preflight.outputs.source_ref }}

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # 构建源码必须与 preflight 锁定的提交一致，否则直接失败。
          test "$sha" = "${{ needs.preflight.outputs.source_sha }}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (Windows GUI)
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade telethon pyinstaller "fastapi>=0.143,<0.144" "uvicorn>=0.54,<0.55" "websockets>=16,<17" Pillow

      - name: Install deps (CLI)
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade telethon pyinstaller

      - name: Build
        shell: bash
        env:
          TGDL_VERSION: ${{ needs.preflight.outputs.release_tag || github.ref_name }}
          TGDL_BUILD: ${{ needs.preflight.outputs.source_sha }}
        run: python build.py dist

      - name: Rename to ASCII release names
        shell: bash
        run: |
          # GitHub 会强制剥离资产名里的非 ASCII（中文）字符，因此上传前
          # 统一改成 ASCII 英文名；中文名通过后续的 asset label 展示。
          norm() {  # $1=源 glob（匹配单个），$2=目标文件名
            for f in $1; do [ -f "$f" ] && mv "$f" "dist/$2"; done
          }
          case "${{ matrix.target }}" in
            windows-x64)
              norm "dist/*_TUI.exe" "TGVideoDownloader_TUI.exe"
              # 注意：dist/*.exe 此时也会匹配已改名的 TUI，必须排除，
              # 否则 TUI 会被移动成 GUI 同名文件而互相覆盖
              for f in dist/*.exe; do
                case "$f" in
                  *_TUI.exe) ;;
                  *) mv "$f" "dist/TGVideoDownloader.exe" ;;
                esac
              done
              ;;
            windows-arm64)
              norm "dist/*_TUI_ARM64.exe" "TGVideoDownloader_TUI_ARM64.exe"
              for f in dist/*_ARM64.exe; do
                case "$f" in
                  *_TUI_ARM64.exe) ;;
                  *) mv "$f" "dist/TGVideoDownloader_ARM64.exe" ;;
                esac
              done
              ;;
            linux-x64)       norm "dist/*linux_x64" "TGVideoDownloader_linux_x64" ;;
            linux-arm64)     norm "dist/*linux_arm64" "TGVideoDownloader_linux_arm64" ;;
            macos-x64)
              norm "dist/*mac_x64.command" "TGVideoDownloader_mac_x64.command"
              norm "dist/*mac_x64" "TGVideoDownloader_mac_x64"
              ;;
            macos-arm64)
              norm "dist/*mac_arm64.command" "TGVideoDownloader_mac_arm64.command"
              norm "dist/*mac_arm64" "TGVideoDownloader_mac_arm64"
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List assets
        run: find artifacts -type f -print

      # 上传前再核对一次远端 Tag 指向：preflight 与这里之间仍可能有并发改动，
      # 正式资产绝不能落到与 Tag 不一致的提交上。
      - name: Assert tag still points at the built commit
        if: needs.preflight.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.release_tag }}"
          SRC="${{ needs.preflight.outputs.source_sha }}"
          remote_sha=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          fi
          if [ "$remote_sha" != "$SRC" ]; then
            echo "::error::Tag ${TAG} 指向 ${remote_sha:-<missing>}，构建源码是 ${SRC}；拒绝覆盖正式资产"
            exit 1
          fi

      - name: Create or update release (tag)
        if: needs.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.preflight.outputs.release_tag }}"
          # Release Notes 单一信源：仓库 release-notes/<tag>.md；
          # 缺失时回落到内置通用说明
          if [ -f "release-notes/${TAG}.md" ]; then
            NOTES=$(cat "release-notes/${TAG}.md")
          else
            NOTES=$(cat <<'EOF'
          ## TG 视频下载器

          Telegram 频道视频批量下载工具（Telethon）。

          ### 下载文件（按系统选择；文件名均为 ASCII，中文说明见资产标签）
          - Windows x64：`TGVideoDownloader.exe`（图形界面）；`TGVideoDownloader_TUI.exe`（控制台版）
          - Windows ARM64（WOA）：`TGVideoDownloader_ARM64.exe`（图形界面）；`TGVideoDownloader_TUI_ARM64.exe`（控制台版）
          - Linux x64：`TGVideoDownloader_linux_x64`（命令行）
          - Linux ARM64：`TGVideoDownloader_linux_arm64`（命令行）
          - macOS Intel：`TGVideoDownloader_mac_x64`（命令行，另附 `.command` 双击启动）
          - macOS Apple Silicon：`TGVideoDownloader_mac_arm64`（命令行，另附 `.command` 双击启动）

          Windows 图形界面支持三种外观：静态暗（默认）、静态亮、液态玻璃（实时采样窗口后方画面）。
          首次运行输入手机号与验证码即可，数据保存在程序平级目录「TG视频下载器数据」。
          EOF
            )
          fi
          mapfile -t FILES < <(find artifacts -type f)
          printf '%s\n' "$TAG"
          # 语义化预发布 tag（如 v2.0.0-beta.1，含连字符）标记为 prerelease，
          # 正式 tag 才标记 latest。Release 已存在时必须显式修正 prerelease
          # 与 latest 状态，只 upload 资产会把历史预发布状态永久留在正式版上。
          if [[ "$TAG" == *-* ]]; then
            CREATE_FLAG="--prerelease"
            EDIT_FLAG="--prerelease=true --latest=false"
          else
            CREATE_FLAG="--latest"
            EDIT_FLAG="--prerelease=false --latest"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES" $EDIT_FLAG
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TAG" \
              --notes "$NOTES" \
              $CREATE_FLAG
          fi

      - name: Set Chinese asset labels
        if: needs.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.preflight.outputs.release_tag }}"
          set_label() {  # $1=ASCII 资产名，$2=中文说明
            local id
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq ".assets[]|select(.name==\"$1\").id")
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" \
                -f label="$2" >/dev/null
            fi
          }
          set_label "TGVideoDownloader.exe" "Windows x64 · 图形界面版 GUI"
          set_label "TGVideoDownloader_TUI.exe" "Windows x64 · 控制台 TUI 版"
          set_label "TGVideoDownloader_ARM64.exe" "Windows ARM64 · 图形界面版 GUI"
          set_label "TGVideoDownloader_TUI_ARM64.exe" "Windows ARM64 · 控制台 TUI 版"
          set_label "TGVideoDownloader_linux_x64" "Linux x64 · 命令行版"
          set_label "TGVideoDownloader_linux_arm64" "Linux ARM64 · 命令行版"
          set_label "TGVideoDownloader_mac_x64" "macOS Intel · 命令行版（附 .command 双击启动）"
          set_label "TGVideoDownloader_mac_arm64" "macOS Apple Silicon · 命令行版（附 .command 双击启动）"

      - name: Create pre-release (manual dispatch)
        if: needs.preflight.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用 preflight 解析出的源码 SHA，而不是分支 HEAD：
          # 手动指定 source_ref 时两者可能不同。
          SRC="${{ needs.preflight.outputs.source_sha }}"
          TAG="dev-${SRC:0:7}"
          mapfile -t FILES < <(find artifacts -type f)
          gh release create "$TAG" "${FILES[@]}" \
            --title "开发构建 $TAG" \
            --notes "手动触发的开发构建，包含全部 6 个平台产物。" \
            --prerelease
