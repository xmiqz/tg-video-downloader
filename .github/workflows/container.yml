name: container

# 职责：验证 Docker 镜像（amd64 + arm64），验证通过后才允许发布 GHCR。
# 顺序固定为 preflight -> validate -> publish -> verify。
# 手动触发默认只验证、不推送；要发布必须显式 publish=true 并指定已存在的 Tag。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "推送到 GHCR（默认 false，只验证不推送）"
        required: false
        type: boolean
        default: false
      tag:
        description: "要发布的已存在 Tag（publish=true 时必填，例如 v2.5.2）"
        required: false
        type: string
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "docker-entrypoint.py"
      - "requirements-server.txt"
      - "server_*.py"
      - "gui.py"
      - "tg_video_dl.py"
      - "web/**"
      - "tools/release_preflight.py"
      - ".github/workflows/container.yml"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tg-video-downloader

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.source_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve publish target
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/release_preflight.py \
            --workflow container \
            --event "$EVENT" \
            --publish "$INPUT_PUBLISH" \
            --release-tag "$INPUT_TAG" \
            --ref-name "$GITHUB_REF_NAME" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

  validate-amd64:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tg-video-downloader:test-amd64
          cache-from: type=gha,scope=tgvd-amd64

      - name: Container smoke (amd64)
        shell: bash
        run: |
          set -euo pipefail
          docker volume rm tgvd-smoke-data >/dev/null 2>&1 || true
          cid=$(docker run -d --name tgvd-test-amd64 \
            --user 10001:10001 \
            --read-only --tmpfs /tmp:rw,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -v tgvd-smoke-data:/data -p 18787:8787 \
            tg-video-downloader:test-amd64)
          trap 'docker rm -f tgvd-test-amd64 >/dev/null 2>&1 || true; docker volume rm tgvd-smoke-data >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18787/healthz >/dev/null; then ready=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' tgvd-test-amd64)" != "true" ]; then
              echo "container exited before becoming ready; logs:" >&2
              docker logs tgvd-test-amd64 >&2 || true
              exit 1
            fi
            sleep 1
          done
          test "$ready" = "1" || { docker logs tgvd-test-amd64 >&2 || true; exit 1; }
          curl -fsS http://127.0.0.1:18787/healthz
          test "$(curl -sS -o /tmp/rpc.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"method":"login_state","params":[]}' \
            http://127.0.0.1:18787/rpc)" = "401"
          test "$(docker exec tgvd-test-amd64 awk '/^Uid:/{print $2}' /proc/1/status)" = "10001"
          docker exec --user 10001 tgvd-test-amd64 python -c \
            "from pathlib import Path; Path('/data/write-probe').write_text('ok')"
          docker exec tgvd-test-amd64 test -f /data/.setup-token

  validate-arm64:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: tg-video-downloader:test-arm64
          cache-from: type=gha,scope=tgvd-arm64

      # QEMU 运行验证：只证明 arm64 镜像可启动并完成健康检查，不等同于
      # 原生 ARM 硬件验证；原生验证仍以 NAS 真机演练为准。
      - name: Container smoke (arm64 via QEMU)
        shell: bash
        run: |
          set -euo pipefail
          docker volume rm tgvd-smoke-arm64 >/dev/null 2>&1 || true
          cid=$(docker run -d --name tgvd-test-arm64 \
            --platform linux/arm64 \
            --user 10001:10001 \
            --read-only --tmpfs /tmp:rw,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -v tgvd-smoke-arm64:/data -p 18788:8787 \
            tg-video-downloader:test-arm64)
          trap 'docker rm -f tgvd-test-arm64 >/dev/null 2>&1 || true; docker volume rm tgvd-smoke-arm64 >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18788/healthz >/dev/null; then ready=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' tgvd-test-arm64)" != "true" ]; then
              echo "arm64 container exited before becoming ready; logs:" >&2
              docker logs tgvd-test-arm64 >&2 || true
              exit 1
            fi
            sleep 1
          done
          test "$ready" = "1" || { docker logs tgvd-test-arm64 >&2 || true; exit 1; }
          curl -fsS http://127.0.0.1:18788/healthz
          test "$(docker exec tgvd-test-arm64 uname -m)" = "aarch64"
          docker exec --user 10001 tgvd-test-arm64 python -c \
            "from pathlib import Path; Path('/data/write-probe').write_text('ok')"

  publish:
    needs: [preflight, validate-amd64, validate-arm64]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      short_sha: ${{ steps.target.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Record publish target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.tag }}"
          test -n "$tag" || { echo "::error::preflight 未解析出 tag，拒绝发布"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${{ needs.preflight.outputs.short_sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只打 Tag 本身，不再生成 dev / dev-<sha> 标签；正式版本不会附带开发标签。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TGDL_VERSION=${{ needs.preflight.outputs.tag }}
            TGDL_BUILD=${{ needs.preflight.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  verify:
    needs: publish
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 校验对象来自 publish 的真实输出，而不是 github.ref_name：
      # 手动触发时 ref_name 是分支名，直接拼镜像标签会校验一个不存在的镜像。
      - name: Verify manifest has amd64 and arm64
        shell: bash
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG:?publish 未输出 tag，拒绝校验不存在的镜像}"
          docker manifest inspect "${IMAGE}:${tag}" > /tmp/manifest.json
          archs=$(jq -r '.manifests[].platform.architecture' /tmp/manifest.json | sort -u | tr '\n' ' ')
          echo "architectures: ${archs}"
          echo "$archs" | grep -qw amd64
          echo "$archs" | grep -qw arm64

      - name: Verify published image reports the tag version and short SHA
        shell: bash
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          SHORT_SHA: ${{ needs.publish.outputs.short_sha }}
        run: |
          set -euo pipefail
          tag="${TAG:?publish 未输出 tag}"
          short="${SHORT_SHA:?publish 未输出 short_sha}"
          docker volume rm tgvd-verify-data >/dev/null 2>&1 || true
          cid=$(docker run -d --name tgvd-verify \
            --user 10001:10001 --read-only --tmpfs /tmp:rw,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -v tgvd-verify-data:/data -p 18789:8787 \
            "${IMAGE}:${tag}")
          trap 'docker rm -f tgvd-verify >/dev/null 2>&1 || true; docker volume rm tgvd-verify-data >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18789/healthz > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          jq -e --arg v "$tag" --arg b "$short" \
            '.version == $v and .build == $b' /tmp/health.json >/dev/null
