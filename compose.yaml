services:
  tg-video-downloader:
    image: ${TGVD_IMAGE:-ghcr.io/xmiqz/tg-video-downloader:v2.6.1}
    container_name: tg-video-downloader
    restart: unless-stopped
    # Fixed unprivileged uid/gid, matching the image's /data owner. The named
    # volume inherits 10001:10001 from the image. A host bind mount must be
    # chowned to 10001:10001 first; PUID/PGID overrides are intentionally not
    # offered here because cap_drop: ALL prevents the entrypoint from chowning.
    user: "10001:10001"
    ports:
      - "${TGDL_PORT:-8787}:8787"
    # Version/build are baked into the image at build time (TGDL_VERSION /
    # TGDL_BUILD build args). Do not override them with empty values here:
    # `TGDL_VERSION: ""` would hide the real version from /healthz.
    environment:
      TGDL_HOST: 0.0.0.0
      TGDL_PORT: "8787"
      TGDL_DATA_DIR: /data
      TGDL_ALLOWED_ROOTS: /data
      TGDL_COOKIE_SECURE: "${TGDL_COOKIE_SECURE:-0}"
      TGDL_TRUST_PROXY: "${TGDL_TRUST_PROXY:-0}"
    volumes:
      # Default: named volume (compatible with existing installs; the image's
      # /data owner 10001:10001 is inherited, so no manual chown is needed).
      # NAS layout: keep app data in a plain host directory next to the
      # container name, e.g. /volume1/docker/tg-video-downloader/data, and set
      # TGVD_DATA_DIR to that absolute path. A host bind mount must be owned by
      # 10001:10001 first, otherwise the container (uid 10001, cap_drop ALL)
      # cannot create /data/downloads and exits with Permission denied.
      - ${TGVD_DATA_DIR:-tgvd-data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  tgvd-data:
    name: tg-video-downloader-data
